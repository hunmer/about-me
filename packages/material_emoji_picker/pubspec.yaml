name: material_emoji_picker
description: A generic but configurable emoji picker for Flutter
version: 1.2.0
repository: https://git.federated.nexus/Henry-Hiles/material_emoji_picker
issue_tracker: https://git.federated.nexus/Henry-Hiles/material_emoji_picker/issues

# vendor 改造说明（本地版本）：
# - 放宽 SDK 约束以适配宿主工程
# - 移除 freezed/json_serializable/material_ui/http 依赖：
#   模型改为手写实现，material_ui 导入替换为 flutter/material

flutter:
    assets:
        - assets/emoji.json
    uses-material-design: true

environment:
    sdk: ^3.10.0

dependencies:
    flutter:
        sdk: flutter
    flutter_riverpod: ^3.4.3
    hooks_riverpod: ^3.4.3
    fast_immutable_collections: ^11.2.0
    collection: ^1.19.1
    flutter_hooks: ^0.21.3+1

dev_dependencies:
    flutter_lints: 6.0.0
