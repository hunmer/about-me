  permission_handler: ^11.3.0
  flutter_animate: ^4.5.2
  fluttertoast: ^9.0.0
  archive: ^4.0.0
  universal_platform: ^1.0.0+1
  uuid: ^4.3.3
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  collection: ^1.17.0
  audioplayers: 6.5.0
  glint_audio_pure: ^0.6.2
  flutter_soloud: ^5.2.1
  dio: ^5.4.1
  logging: ^1.2.0
  flutter_form_builder: ^10.2.0
  path: ^1.8.3
  flutter_swipe_action_cell: ^3.1.6
  super_clipboard: ^0.9.1
  file_picker: 10.3.0
  flutter_quill: ^11.5.1
  flutter_quill_extensions: ^11.0.0
  intl: ^0.20.2
  flutter_colorpicker: ^1.1.0
  provider: ^6.1.1
  live_activities: ^2.4.3
  reorderable_grid_view: ^2.0.0
  animated_flip_counter: ^0.3.4
  device_calendar: ^4.3.3
  timezone: ^0.10.0
  url_launcher: ^6.2.5
  crop_your_image: ^2.0.0
  fl_chart: ^0.66.2
  graphview: ^1.5.1
  package_info_plus: ^9.0.0
  flutter_styled_toast: ^2.3.0
  smooth_sheets: ^0.15.0
  wechat_assets_picker: ^10.1.3
  photo_manager: ^3.12.0  # 保存贴图到系统相册（CuteNotepadEditor）
  lottie: ^3.3.2
  infinite_carousel: ^1.1.1
  animated_tree_view: ^2.3.0
  image: ^4.1.3
  mime: ^2.0.0
  http: ^1.3.0
  photo_view: ^0.15.0
  share_plus: ^10.1.4
  record: ^6.0.0
  flutter_staggered_grid_view: ^0.7.0
  xue_hua_media_info: ^2.1.0
  agentlib:
    path: packages/agentlib
  web_socket_channel: ^3.0.0
  crypto: ^3.0.3
  flutter_inappwebview: ^6.1.5
  syncfusion_flutter_calendar: ^29.1.41
  syncfusion_localizations: ^29.1.41
  timeago: ^3.7.1
  dart_date: ^1.5.3
  location: ^8.0.1
  fs_shim: ^2.4.0
  flutter_shortcut_plus: ^1.0.1
  video_player: ^2.9.2
  video_player_win: ^3.2.1
  adaptive_theme: 3.7.2
  flutter_js: ^0.8.1
  image_compress_plus: ^4.0.0  # flutter_image_compress 社区分支，额外支持 Windows/Linux
  extended_tabs: ^5.0.0
  json_dynamic_widget: ^12.0.0
  flutter_markdown: ^0.7.4  # For agent_chat plugin Markdown rendering
  flutter_tts: ^3.8.0  # Text-to-Speech for TTS plugin
