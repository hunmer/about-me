  super_cupertino_navigation_bar:
    path: packages/super_cupertino_navigation_bar
  # 弧形圆盘浮动底部导航栏（双层同心圆弧 + 滑动药丸，参考 floating-bottom-bar）
  radial_disc_bottom_bar:
    path: packages/radial_disc_bottom_bar
  floating_ball_plugin:
    path: packages/floating_ball_plugin
  aboutme_widgets:
    path: packages/aboutme_widgets
