  firebase_messaging: ^15.0.0
  flutter_foreground_task: ^9.1.0  # Foreground task for voice call
  wheel_picker: ^0.2.2  # Wheel picker for time selection
  lpinyin: ^2.0.3  # Chinese pinyin conversion for tag filtering
  watch_connectivity: ^0.2.8  # Watch connectivity for watchOS communication
  flutter_floating_bottom_bar: ^1.3.0  # Floating bottom bar for bill plugin
