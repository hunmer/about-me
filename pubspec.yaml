  aboutme_foreground_service:
    path: packages/aboutme_foreground_service
  aboutme_notifications:
    path: packages/aboutme_notifications
  aboutme_intent:
    path: packages/aboutme_intent
  aboutme_nfc:
    path: packages/aboutme_nfc
  shared_models:
    path: ./shared_models
  # 纯数据 SDK：存储接口/远端 HTTP 存储/数据管理门面（服务端 aboutme_server 复用同一数据核心）
  aboutme_data_sdk:
    path: packages/aboutme_data_sdk

  flutter_localizations:
    sdk: flutter
  full_swipe_back_gesture: ^0.1.2
  scroll_to_index: ^3.0.1
  intelligence: ^0.2.0
  live2d_flutter:
    path: ../flutter_live2d-main

  # procm-mcp 房间客户端 SDK（结构化日志 / trace）
  procm_sdk_dart: ^0.1.0
  dartantic_ai:
    path: packages/dartantic_ai
  flutter_riverpod: ^3.4.3
  fast_immutable_collections: ^11.2.0
  # 桌面端窗口位置/大小记忆
  window_manager: ^0.5.1
  screen_retriever: ^0.2.0
  flutter_svg: ^2.2.0
  skribble: ^0.3.1
  skribble_icons_material: ^0.3.1
  video_thumbnail: ^0.5.6
  flutter_json_view: ^1.1.5
  flutter_map: ^8.2.2  # Moments NYC demo 地图（lib/widgets/moments_nyc_map_demo.dart）
  latlong2: ^0.9.1
  pro_image_editor: ^14.15.0
  material_ui: ^1.8.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.6

dependency_overrides:
  # 本地 vendor 副本：WiredMotion 支持 drawDuration，设置页可全局调入场动画时长
  skribble:
    path: packages/skribble
  # Waiting for https://github.com/Lyokone/flutterlocation/issues/1031
  location_web:
    git:
      url: https://github.com/Lyokone/flutterlocation
      path: packages/location_web
      ref: location-v8.0.1
  timezone: ^0.10.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  
  generate: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/audio/msg_sended.mp3
    - assets/audio/glass_clink.mp3  # 日记心情罐碰撞声
    - assets/audio/pop.mp3  # 日记心情罐点击弹跳声
    - assets/audio/white_noise/  # 预设白噪音（wnoise.org，个人使用）
    - assets/icon/icon.png
    - assets/images/image_not_found.jpg
    - assets/images/default_avatar.jpg
    - assets/tool_templates/
    - assets/icons/material/  # Material Icons for Android widgets
    - assets/icons/svg/  # SVG 图标（空状态等）
    - assets/svg/items/  # 默认物品封面 SVG（cute easy drawings / cozy tech / cozy furniture）
    - assets/icons/providers/  # LLM 提供商 logo（models.dev，currentColor 自动适配明暗）
    - assets/animations/  # Lottie animations
    - assets/floating_ball_icons/  # Preset images for floating ball
    - assets/models/mao/
    - assets/models/mao/mao_pro.4096/
    - assets/models/mao/motions/
    - assets/models/mao/expressions/
    - lib/plugins/agent_chat/tools/
    - assets/scripts/line_sticker/  # 内置脚本（LINE 贴图下载）
    - assets/openai/topic_collections/  # 内置话题合集目录 JSON（按 version 更新）
    - assets/emojis/  # 内置表情包
    - assets/emoji_faces/  # 方块表情（透明 WebP，切分脚本 docs/emoji_sheet/）
    - assets/emoji/emoji.json  # Unicode 表情数据（表情选择器）
    - assets/achievements/  # 成就系统图标（A01~A74，透明 WebP）
    - assets/bubbles/  # Live2D 气泡皮肤（透明 WebP）
    - assets/live2d_backgrounds/  # Live2D 小屋背景图（JPG）
    - assets/jelly_icons/  # 状态面板属性图标（透明 WebP，切分脚本 docs/jelly_icons/）
    - assets/agents/  # 内置智能体封面（竖版 WebP，切分脚本 tools/agent_covers/）

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  fonts:
    # 851 手写杂书体（日系手写，覆盖假名/汉字/英文），design_system 手绘风主字体
    # （AlibabaPuHuiTi 已删除：全局字体统一为手写杂书体）
    - family: TegakiZatsu
      fonts:
        - asset: assets/fonts/851tegaki_zatsu_normal_0883.ttf

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

flutter_native_splash:
  # 生成: dart run flutter_native_splash:create  还原: dart run flutter_native_splash:remove
  # 全屏启动图（原图 webp 不受支持，已转为 PNG，源: 高清 (2).webp 1440x2560）
  # 注意: 重新生成后 iOS storyboard 的 LaunchBackground 会被重置为 scaleToFill（拉伸变形），
  # 需手动把 ios/Runner/Base.lproj/LaunchScreen.storyboard 中 LaunchBackground 的 contentMode 改回 scaleAspectFill
  background_image: "assets/splash/splash.png"
  android_12:
    # Android 12+ 系统限制不支持全屏背景图，仅显示纯色 + 圆形图标（取自图片平均色）
    color: "#5D4D65"
    # 圆形图标（icon.png 缩放至推荐的 1152x1152）
    image: "assets/splash/splash_android12.png"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
