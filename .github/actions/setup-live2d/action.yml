name: Set up Live2D dependency
description: Restore the sibling path dependency on clean CI runners.
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: hunmer/flutter_live2d
        ref: 7e829b67a6db220c3a50d857c09aeb69c9b068be
        path: .ci/flutter_live2d
        persist-credentials: false
    - shell: bash
      run: mv ".ci/flutter_live2d" "../flutter_live2d-main"
