name: Windows
permissions:
  contents: write
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        
    - name: Set up Live2D dependency
      uses: ./.github/actions/setup-live2d

    - name: Install dependencies
      run: flutter pub get

    - name: Install native image libraries
      shell: pwsh
      run: |
        $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
        if (-not $vcpkgRoot) { throw "VCPKG_INSTALLATION_ROOT is not set" }
        "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
        & "$vcpkgRoot/vcpkg.exe" install libjpeg-turbo:x64-windows libpng:x64-windows libwebp:x64-windows exiv2:x64-windows
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      
    - name: Build Windows
      run: flutter build windows --release --no-tree-shake-icons

    - name: Create ZIP package
      run: |
        $releaseDir = "build/windows/x64/runner/Release"
        Compress-Archive -Path "$releaseDir" -DestinationPath "$releaseDir/Aboutme-windows.zip" -Force
      
    - name: Get current date
      id: date
      shell: pwsh
      run: echo "date=$(Get-Date -Format 'yyyy-MM-dd')" >> $env:GITHUB_OUTPUT

    - name: Get commit SHA
      id: commit_sha
      shell: pwsh
      run: echo "sha=$((git rev-parse --short HEAD))" >> $env:GITHUB_OUTPUT

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: build/windows/x64/runner/Release/Aboutme-windows.zip
        tag_name: release-${{ steps.date.outputs.date }}-${{ steps.commit_sha.outputs.sha }}
        generate_release_notes: false
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-release
        path: build/windows/x64/runner/Release/
